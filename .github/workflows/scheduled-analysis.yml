name: BTC Momentum Analysis

on:
  # 定时任务：每小时执行（使用 UTC 时间）
  schedule:
    - cron: '0 * * * *'

  # 支持手动触发
  workflow_dispatch:

  # 可选：推送到 main 分支时也触发（测试用）
  # push:
  #   branches: [ main ]

# 设置权限
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    # 设置超时时间
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，用于 GitHub Pages

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'  # 缓存依赖

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建必要的目录
        run: |
          mkdir -p data reports logs

      - name: 初始化订阅数据库
        run: |
          if [ ! -f data/subscriptions.db ]; then
            echo "数据库不存在，初始化数据库..."
            python scripts/init_subscription_db.py
          else
            echo "数据库已存在，跳过初始化"
          fi

      - name: 运行动能分析（支持多币种）
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          python scripts/run_analysis.py

      - name: 准备 GitHub Pages 部署
        run: |
          mkdir -p deploy
          cp index.html deploy/
          cp -r reports deploy/
          cp .nojekyll deploy/

      - name: 部署到 GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          destination_dir: ./
          keep_files: true  # 保留历史报告
          commit_message: '更新分析报告 ${{ github.run_number }}'

      - name: 提交订阅数据库到仓库
        if: success() && always()
        run: |
          # 配置 git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 检查数据库是否有变化
          if [ -f data/subscriptions.db ]; then
            git add data/subscriptions.db

            # 检查是否有新的更改
            if git diff --cached --quiet; then
              echo "数据库无变化，跳过提交"
            else
              echo "数据库有更新，提交更改..."
              git commit -m "chore: 更新订阅数据库 [skip ci]"
              git push
              echo "✅ 数据库已提交到仓库"
            fi
          else
            echo "⚠️ 数据库文件不存在"
          fi

      - name: 上传日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore  # 如果没有日志文件，忽略错误

      - name: 通知失败
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            core.setFailed('分析任务失败，请查看日志')
